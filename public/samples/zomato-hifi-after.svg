<svg width="800" height="920" viewBox="0 0 800 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sh">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="zred2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E23744"/>
      <stop offset="100%" stop-color="#C12030"/>
    </linearGradient>
    <linearGradient id="zbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1B18"/>
      <stop offset="100%" stop-color="#2D2A25"/>
    </linearGradient>
    <clipPath id="screen-after">
      <rect x="100" y="10" width="600" height="870" rx="44"/>
    </clipPath>
  </defs>

  <rect width="800" height="920" fill="url(#zbg)"/>
  <text x="400" y="30" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#E23744" letter-spacing="0.10em">AFTER — SINGLE-SCREEN CHECKOUT (HI-FI)</text>

  <!-- Phone body -->
  <rect x="96" y="54" width="608" height="840" rx="52" fill="#0D0D0B" filter="url(#sh)"/>
  <rect x="100" y="58" width="600" height="832" rx="48" fill="#0D0D0B"/>

  <g clip-path="url(#screen-after)">
    <rect x="100" y="58" width="600" height="832" fill="#FAFAFA"/>

    <!-- Status bar -->
    <rect x="100" y="58" width="600" height="44" fill="url(#zred2)"/>
    <text x="124" y="85" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="white">9:41</text>
    <text x="630" y="86" font-family="Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">▪▪▪▪</text>

    <!-- Nav bar -->
    <rect x="100" y="102" width="600" height="56" fill="url(#zred2)"/>
    <path d="M134 130 L124 122 L134 114" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="400" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">Review &amp; Pay</text>

    <!-- ZONE 1: Order Summary (collapsed, trustworthy) -->
    <rect x="100" y="158" width="600" height="2" fill="#F3F4F6"/>
    <rect x="116" y="168" width="568" height="72" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="132" y="188" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.08em">ORDER SUMMARY</text>
    <text x="132" y="208" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#111827">Barbeque Nation + 3 items</text>
    <text x="132" y="226" font-family="Arial,sans-serif" font-size="12" fill="#9CA3AF">Subtotal ₹340 · Tap to expand</text>
    <path d="M652 198 L660 210 L668 198" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- ZONE 2: Delivery Details (UPFRONT - key fix) -->
    <rect x="116" y="252" width="568" height="100" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
    <rect x="116" y="252" width="4" height="100" rx="2" fill="#10B981"/>
    <text x="132" y="272" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.08em">DELIVERY DETAILS</text>
    <text x="132" y="292" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#111827">Home · 42, Indiranagar 12th Main</text>
    <rect x="132" y="302" width="200" height="1" fill="#F3F4F6"/>
    <!-- Delivery time + prep time shown together -->
    <rect x="132" y="310" width="80" height="28" rx="6" fill="#F0FDF4"/>
    <text x="172" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#16A34A">🛵 28 min</text>
    <text x="172" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#6B7280">delivery</text>
    <rect x="222" y="310" width="80" height="28" rx="6" fill="#FFF7ED"/>
    <text x="262" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#EA580C">🍳 20 min</text>
    <text x="262" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#6B7280">prep time</text>
    <text x="558" y="326" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#E23744">Change</text>

    <!-- ZONE 3: Fee breakdown (fully transparent) -->
    <rect x="116" y="364" width="568" height="120" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="132" y="384" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.08em">FEE BREAKDOWN</text>
    <text x="132" y="404" font-family="Arial,sans-serif" font-size="13" fill="#374151">Item total</text>
    <text x="668" y="404" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#374151">₹340</text>
    <text x="132" y="424" font-family="Arial,sans-serif" font-size="13" fill="#374151">Delivery fee</text>
    <text x="668" y="424" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#374151">₹49</text>
    <text x="132" y="444" font-family="Arial,sans-serif" font-size="13" fill="#374151">Platform fee</text>
    <text x="668" y="444" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#374151">₹5</text>
    <text x="132" y="464" font-family="Arial,sans-serif" font-size="13" fill="#374151">GST</text>
    <text x="668" y="464" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#374151">₹17</text>
    <rect x="132" y="470" width="536" height="1" fill="#F3F4F6"/>
    <text x="132" y="488" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#111827">Total</text>
    <text x="668" y="488" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#111827">₹411</text>

    <!-- Offers chip -->
    <rect x="116" y="496" width="568" height="44" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="136" y="523" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#16A34A">🎉  WELCOME50 applied — saved ₹50</text>

    <!-- ZONE 4: Payment (contextual default surfaced) -->
    <rect x="116" y="552" width="568" height="80" rx="10" fill="white" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="132" y="572" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="0.08em">PAYMENT</text>
    <!-- Last used method surfaced prominently -->
    <rect x="132" y="580" width="400" height="40" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
    <rect x="142" y="590" width="22" height="22" rx="4" fill="#16A34A"/>
    <text x="153" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="white">UPI</text>
    <text x="176" y="599" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#111827">PhonePe UPI</text>
    <text x="176" y="613" font-family="Arial,sans-serif" font-size="11" fill="#16A34A">Last used · Recommended</text>
    <text x="558" y="601" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#9CA3AF">Change</text>

    <!-- Fixed CTA with live price -->
    <rect x="100" y="648" width="600" height="90" fill="white"/>
    <rect x="100" y="648" width="600" height="1" fill="#E5E7EB"/>
    <rect x="116" y="660" width="568" height="56" rx="12" fill="url(#zred2)"/>
    <text x="300" y="693" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="white">Place Order</text>
    <text x="620" y="688" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.85)">₹411</text>

    <!-- Bottom safe area -->
    <rect x="100" y="720" width="600" height="170" fill="#FAFAFA"/>
    <rect x="320" y="800" width="160" height="5" rx="3" fill="#D1D5DB"/>
  </g>

  <!-- Notch -->
  <rect x="310" y="58" width="180" height="36" rx="0" fill="#0D0D0B"/>
  <rect x="335" y="68" width="130" height="18" rx="9" fill="#111"/>

  <text x="400" y="904" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#9CA3AF">After: Single-screen — all critical info above the fold. 0 hidden surprises.</text>
</svg>