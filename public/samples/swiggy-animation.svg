<svg width="480" height="480" viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse {
      0%   { transform: scale(1);    opacity: 1; }
      40%  { transform: scale(0.92); opacity: 0.9; }
      70%  { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1);    opacity: 1; }
    }
    @keyframes ring1 {
      0%   { r: 64;  opacity: 0.5; }
      100% { r: 110; opacity: 0; }
    }
    @keyframes ring2 {
      0%   { r: 64;  opacity: 0.3; }
      100% { r: 130; opacity: 0; }
    }
    @keyframes dot1 {
      0%, 100% { transform: translateY(0); opacity: 1; }
      40%       { transform: translateY(-14px); opacity: 1; }
      60%       { transform: translateY(0); opacity: 0.6; }
    }
    @keyframes dot2 {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      40%       { transform: translateY(-14px); opacity: 1; }
      60%       { transform: translateY(0); opacity: 0.4; }
    }
    @keyframes dot3 {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      40%       { transform: translateY(-14px); opacity: 0.8; }
      60%       { transform: translateY(0); opacity: 0.2; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.06; }
      50%       { opacity: 0.14; }
    }
    .logo-group {
      transform-origin: 240px 210px;
      animation: pulse 2.8s cubic-bezier(0.34,1.56,0.64,1) infinite;
    }
    .ring1 { animation: ring1 2.8s ease-out infinite; transform-origin: 240px 210px; }
    .ring2 { animation: ring2 2.8s ease-out 0.2s infinite; transform-origin: 240px 210px; }
    .dot1  { animation: dot1 2.8s ease-in-out infinite; transform-origin: 200px 330px; }
    .dot2  { animation: dot2 2.8s ease-in-out 0.12s infinite; transform-origin: 240px 330px; }
    .dot3  { animation: dot3 2.8s ease-in-out 0.24s infinite; transform-origin: 280px 330px; }
    .bg-glow { animation: breathe 2.8s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="480" height="480" fill="#1C1B18"/>

  <!-- Background glow -->
  <circle class="bg-glow" cx="240" cy="210" r="160" fill="#FC8019"/>

  <!-- Ripple rings -->
  <circle class="ring1" cx="240" cy="210" r="64" stroke="#FC8019" stroke-width="3" fill="none"/>
  <circle class="ring2" cx="240" cy="210" r="64" stroke="#FC8019" stroke-width="2" fill="none"/>

  <!-- Logo group: orange rounded square with S -->
  <g class="logo-group">
    <rect x="176" y="146" width="128" height="128" rx="36" fill="#FC8019"/>
    <!-- S letterform -->
    <path d="M268 175 C268 175 228 172 218 185 C208 198 218 210 234 214 C250 218 264 222 262 237 C260 252 238 258 218 254"
          stroke="white" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Loading dots -->
  <circle class="dot1" cx="200" cy="330" r="9" fill="#FC8019"/>
  <circle class="dot2" cx="240" cy="330" r="9" fill="#FC8019"/>
  <circle class="dot3" cx="280" cy="330" r="9" fill="#FC8019"/>

  <!-- Swiggy wordmark below dots -->
  <text x="240" y="388" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#F0EEE9" letter-spacing="0.04em">swiggy</text>
  <text x="240" y="408" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6B7280" letter-spacing="0.08em">Loading your feed...</text>

  <!-- Frame label -->
  <text x="240" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#3A3734" letter-spacing="0.06em">LIVE ANIMATION · 2.8s · LOTTIE COMPATIBLE</text>
</svg>