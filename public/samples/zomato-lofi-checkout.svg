  <text x="60" y="72" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#1C1B18" letter-spacing="-0.03em">Old 7-step checkout flow — annotated drop-off analysis</text>

